<!DOCTYPE html>
<html lang="en">
<head>

  <link rel="stylesheet" href="teste.css">

<body>

    <figure class="logo">

    <nav>

      <ul class="menu">
        <li><a href="#">Home</a></li>

        <li><a href="#">About Us</a></li>
      </ul>

    </nav>

  </header>

  <main style="grid-area: main;">

    <section class="title">
      
      <h1></h1>

    </section>

    <section class="flowey">
      
      <div class="content" style="grid-area: content;">

        <h2></h2>

        <p></p>

      </div>

      <img src="./Characters image/Flowey.png" alt="" style="grid-area: img;">

    </section>

    <section class="sans">
      
      <div class="content" style="grid-area: content;">

    <section class="papyrus">
      
      <div class="content" style="grid-area: content;">

        <h2></h2>
  
        <p></p>

      </div>

      <img src="./Characters image/Papyrus.jpg" alt="">

    </section>

    <section class="undyne">
      
      <div class="content" style="grid-area: content;">

        <h2></h2>
  
        <p></p>

      </div>

      <figure class="theUndyingHero">
        
        <img src="./Characters image/Undyne 1.jpg" alt="" style="grid-area: merge;">
        
        <img src="./Characters image/Undyne 2.jpg" alt="" style="background-color: #FF6050; grid-area: merge;">
      
      </figure>

    </section>

    <section class="asgore">
      
      <div class="content" style="grid-area: content;">

        <h2></h2>
  
        <p></p>

      </div>

      <img src="./Characters image/Asgore.jpg" alt="">

    </section>

  <footer  style="grid-area: footer;">

    <div class="footerContent" style="grid-area: footerContent;">
  
      <figure class="companyDescription" style="grid-area: description;">
        
        <img src="./favicon/Undertale-Logo.png" alt="">
        
        <figcaption>
          We make good games for free
        </figcaption>
        
      </figure>
      
      <figure class="icons" style="grid-area: icons;">
        
        <img src="./favicon/Insta.png" alt="">
        <img src="./favicon/linkedin.png" alt="">
        <img src="./favicon/Twitter.png" alt="">
        
      </figure>
      
    </div>

    <nav style="grid-area: footerNav;">

      <ul>
        <li>Core features</li>
        <li>Pro experience</li>
        <li>Integrations</li>
      </ul>
      
      <ul>
        <li>Blog</li>
        <li>Case studies</li>
        <li>Customer</li>
        <li>Stories</li>
        <li>Best practices</li>
      </ul>
      
      <ul>
