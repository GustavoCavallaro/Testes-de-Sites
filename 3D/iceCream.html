<!DOCTYPE html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="theme-color" content="#ffffff">
	<title>Cobertura de sorvete</title>
	<style>
		* { box-sizing: border-box; }

		html, body {
			width: 100%;
			height: 100%;
			margin: 0;
			overflow: hidden;
			background: #ffffff;
		}

		#scene {
			position: fixed;
			inset: 0;
			display: block;
			width: 100%;
			height: 100%;
			image-rendering: pixelated;
			touch-action: none;
			cursor: grab;
		}

		#scene:active { cursor: grabbing; }
	</style>
	<script type="importmap">
		{
			"imports": {
				"three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
			}
		}
	</script>
	<script type="module" src="./Cobertura.js"></script>
</head>
<body>
	<canvas id="scene" aria-label="Cobertura de sorvete em pixel art"></canvas>
</body>
</html>
