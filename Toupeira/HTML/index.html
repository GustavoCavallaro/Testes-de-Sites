<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../CSS/style.css">
</head>
<body>
  <main>
    <aside class="attack-mole-aside">
      <img src="../img/placa.png" class="attack-mole-img">
    </aside>
    <aside class="score-aside">
      <p class="js-score score">Pontuação:</p>
      <p class="minus1 js-minus1">-1</p>
      <button class="reset-score-button js-reset-score-button">Reset Score</button>
    </aside>
    <section class="grass-section-1">
      <div>
      
        <img src="../img/buraco-na-grama.jpg" class="grass-hole js-img-mole img1">
        <video src="" class="v1 grass-hole" playsinline muted autoplay></video>
      
      </div>
      <div>
      
        <img src="../img/buraco-na-grama.jpg" class="grass-hole js-img-mole img2">
        <video src="" class="v2 grass-hole" playsinline muted autoplay></video>

      </div>
    </section>
    <section class="grass-section-2">
      <div>
      
        <img src="../img/buraco-na-grama.jpg" class="grass-hole js-img-mole img3">
        <video src="" class="v3 grass-hole" playsinline muted autoplay></video>
      
      </div>
      <div>
      
        <img src="../img/buraco-na-grama.jpg" class="grass-hole js-img-mole img4">
        <video src="" class="v4 grass-hole" playsinline muted autoplay></video>

      </div>
    </section>
    <aside class="start-button-aside">
      <button class="js-start-game-button start-game-button">Start Game!</button>
    </aside>
  </main>

  <!-- <script src="../JS/script.js"></script> -->
</body>
</html>
