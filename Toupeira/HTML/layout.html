<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
  <link rel="stylesheet" href="../CSS/layout.css">
</head>
<body>
  <main>
    <img src="../img/ilha.png" class="sland-img">
    <img src="../img/placa.png" class="placa-img">

    <section class="hole-sect">
      <div class="img-video-container-div">
        <img src="../img/buraco.png" class="hole-img hole-1 js-img-mole img1">
        <video src="" class="hole-1 hole-video v1" playsinline muted autoplay></video>
      </div>
      <div class="img-video-container-div">
        <img src="../img/buraco.png" class="hole-img hole-2 js-img-mole img2">
        <video src="" class="hole-2 hole-video v2" playsinline muted autoplay></video>
      </div>
      <div class="img-video-container-div">
        <img src="../img/buraco.png" class="hole-img hole-3 js-img-mole img3">
        <video src="" class="hole-3 hole-video v3" playsinline muted autoplay></video>
      </div>
      <div class="img-video-container-div">
        <img src="../img/buraco.png" class="hole-img hole-4 js-img-mole img4">
        <video src="" class="hole-4 hole-video v4" playsinline muted autoplay></video>
      </div>
    </section>

    <section class="start-game-button-sect">
      <button class="js-start-game-button start-game-button">
        <img src="../img/play icon.png" class="start-game-icon js-start-game-icon">
      </button>
    </section>

    <section class="score-sect">
      <div class="score-div">
        <p class="score js-score">Score: </p>
        <p class="minus1 js-minus1">-1</p>
      </div>
      <button class="reset-score-button js-reset-score-button">Reset Score</button>
    </section>
  </main>

  <script src="../JS/script.js"></script>
</body>
</html>
